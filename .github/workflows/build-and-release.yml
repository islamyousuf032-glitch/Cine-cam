name: CineCam - Build and Release APK

on:
  push:
    branches:
      - main
      - "arena/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Debug & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK & NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDKMGR=$(find $ANDROID_HOME -name "sdkmanager" -type f 2>/dev/null | head -1)
          if [ -z "$SDKMGR" ]; then SDKMGR=$(find $ANDROID_SDK_ROOT -name "sdkmanager" -type f 2>/dev/null | head -1); fi
          if [ -z "$SDKMGR" ]; then SDKMGR="sdkmanager"; fi
          echo "Using sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses || true
          "$SDKMGR" --install "ndk;26.1.10909125" "cmake;3.22.1" "build-tools;34.0.0" "platforms;android-34" || {
            yes | sdkmanager --licenses || true
            sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1" "build-tools;34.0.0" "platforms;android-34" || true
          }
          ls -lh $ANDROID_HOME/ndk/ 2>&1 | head -20 || true
          NDK_PATH=""
          if [ -d "$ANDROID_HOME/ndk/26.1.10909125" ]; then NDK_PATH="$ANDROID_HOME/ndk/26.1.10909125"
          elif [ -d "$ANDROID_SDK_ROOT/ndk/26.1.10909125" ]; then NDK_PATH="$ANDROID_SDK_ROOT/ndk/26.1.10909125"; fi
          if [ -n "$NDK_PATH" ]; then
            echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
            echo "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
          else
            ANY_NDK=$(find $ANDROID_HOME $ANDROID_SDK_ROOT -path "*ndk/*/source.properties" 2>/dev/null | head -1 | xargs dirname 2>/dev/null | xargs dirname 2>/dev/null || true)
            if [ -n "$ANY_NDK" ]; then
              mkdir -p $(dirname "$ANDROID_HOME/ndk") 2>/dev/null || true
              ln -sf "$ANY_NDK" "$ANDROID_HOME/ndk/26.1.10909125" 2>/dev/null || true
              echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
            fi
          fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Generate version
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          RUN_NUMBER=${{ github.run_number }}
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION_NAME=${{ github.ref_name }}
            VERSION_TAG=${{ github.ref_name }}
          else
            VERSION_NAME="v0.1.${RUN_NUMBER}-alpha"
            VERSION_TAG="v0.1.${RUN_NUMBER}-${SHORT_SHA}"
          fi
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "version_tag=${VERSION_TAG}" >> $GITHUB_OUTPUT
          echo "version_code=${RUN_NUMBER}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION_NAME} (code: ${RUN_NUMBER})"

      - name: Build Debug APK
        id: build_debug
        run: |
          set -o pipefail
          ./gradlew assembleDebug \
            -PversionName=${{ steps.version.outputs.version_name }} \
            -PversionCode=${{ steps.version.outputs.version_code }} \
            --stacktrace --info 2>&1 | tee build_debug.log
        continue-on-error: false

      - name: Print build log tail (for debugging without artifact download)
        if: always()
        run: |
          echo "========== BUILD DEBUG LOG TAIL (last 300 lines) =========="
          tail -n 300 build_debug.log || echo "No log"
          echo "========== END LOG =========="
          # Also show specific error lines
          grep -i "error\|failed\|exception\|FAILED" build_debug.log | head -100 || true
          # Show CMake log if exists
          cat app/build/intermediates/cmake/debug/*/cmake_build_output.txt 2>&1 | head -200 || true
          find app/build -name "CMakeOutput.log" -o -name "CMakeError.log" | xargs cat 2>&1 | head -300 || true

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ steps.version.outputs.version_name }}
          path: |
            build_debug.log
            app/build/reports/**/*
          if-no-files-found: warn
          retention-days: 7

      - name: Build Release APK (only if debug succeeded)
        if: success()
        run: |
          ./gradlew assembleRelease \
            -PversionName=${{ steps.version.outputs.version_name }} \
            -PversionCode=${{ steps.version.outputs.version_code }} \
            --stacktrace | tee build_release.log

      - name: List APKs
        if: always()
        run: |
          echo "=== APKs ==="
          find app/build/outputs -name "*.apk" -type f | xargs ls -lh 2>&1 || echo "No APKs"
          ls -lh app/build/outputs/apk/debug/ 2>&1 | head -20 || true
          ls -lh app/build/outputs/apk/release/ 2>&1 | head -20 || true
          echo "=== Build outputs ==="
          ls -lh app/build/outputs/ 2>&1 | head -50 || true

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CineCam-${{ steps.version.outputs.version_name }}-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create Issue with log on failure (for agent debugging via api.github.com)
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOG_TAIL=$(tail -n 200 build_debug.log | head -c 6000 || echo "no log")
          ERR_LINES=$(grep -i "error\|FAILED\|exception" build_debug.log | head -n 50 | head -c 3000 || echo "no errors")
          TITLE="CineCam build failed run ${{ github.run_number }} - ${{ steps.version.outputs.version_name }}"
          BODY="**Build failed:** ${{ steps.version.outputs.version_name }} (run ${{ github.run_number }})\n\n**Error lines:**\n\`\`\`\n$ERR_LINES\n\`\`\`\n\n**Log tail:**\n\`\`\`\n$LOG_TAIL\n\`\`\`\n\n[View run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          # Escape body for JSON
          JSON_BODY=$(printf '%s' "$BODY" | python3 -c "import json,sys; print(json.dumps(sys.stdin.read()))")
          JSON_TITLE=$(printf '%s' "$TITLE" | python3 -c "import json,sys; print(json.dumps(sys.stdin.read()))")
          curl -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/issues \
            -d "{\"title\": $JSON_TITLE, \"body\": $JSON_BODY, \"labels\": [\"ci-failure\"]}" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('ISSUE_URL:', d.get('html_url',''), 'NUMBER:', d.get('number',''))" || true
          echo "Issue created (if URL above)"

      - name: Prepare Release Notes
        if: github.event_name != 'pull_request' && success()
        run: |
          cat > /tmp/release_notes.md << 'EOF'
          ## CineCam ${{ steps.version.outputs.version_name }} - Professional RAW Camera

          **Build:** `${{ steps.version.outputs.short_sha }}` | **Run:** `#${{ github.run_number }}` | **Branch:** `${{ github.ref_name }}`

          ### ধাপ ১ - বেস আর্কিটেকচার (এই রিলিজে যা আছে)
          - ✅ Kotlin + NDK/C++ হাইব্রিড আর্কিটেকচার (MotionCam অনুপ্রাণিত)
          - ✅ `MemoryPool` - Zero-copy 4096-aligned বাফার পুল
          - ✅ `RingBuffer` - SPSC Lock-Free Circular Queue
          - ✅ `RawWriter` - হাই-স্পিড স্টোরেজ রাইটার (MCRAW / CinemaDNG)
          - ✅ `CineRawEngine` - সেন্ট্রাল JNI ব্রিজ
          - ✅ `GlPreviewRenderer` - OpenGL ES 3.1 লাইভ প্রিভিউ
          - ✅ Camera2 Capability Checker
          - ✅ Jetpack Compose UI - Manual Controls + FPS Selector
          - ✅ GitHub Actions CI/CD - অটো APK Build & Release

          ### ডাউনলোড
          নিচের `Assets` থেকে `app-debug.apk` ডাউনলোড করুন

          ### পরবর্তী ধাপ (ধাপ ২)
          - Camera2 Live Preview + Permission flow

          ### টেকনিক্যাল
          - `minSdk 26` | `targetSdk 34` | `NDK 26.1` | `C++17`
          - ABIs: `arm64-v8a`, `armeabi-v7a`, `x86_64`

          ---
          *Auto-generated by GitHub Actions*
          EOF
          cat /tmp/release_notes.md

      - name: Create GitHub Release
        if: github.event_name != 'pull_request' && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version_tag }}
          name: CineCam ${{ steps.version.outputs.version_name }}
          body_path: /tmp/release_notes.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version_name, 'alpha') }}
          fail_on_unmatched_files: false
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: always()
        run: |
          echo "### CineCam Build" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.version_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** ${{ steps.version.outputs.version_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ steps.version.outputs.short_sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
