name: CineCam - Build and Release APK

on:
  push:
    branches:
      - main
      - "arena/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Debug & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK & NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMGR=$(find $ANDROID_HOME -name "sdkmanager" -type f 2>/dev/null | head -1)
          if [ -z "$SDKMGR" ]; then SDKMGR=$(find $ANDROID_SDK_ROOT -name "sdkmanager" -type f 2>/dev/null | head -1); fi
          if [ -z "$SDKMGR" ]; then SDKMGR="sdkmanager"; fi
          echo "Using sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses || true
          "$SDKMGR" --install "ndk;26.1.10909125" "cmake;3.22.1" "build-tools;34.0.0" "platforms;android-34" || {
            yes | sdkmanager --licenses || true
            sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1" "build-tools;34.0.0" "platforms;android-34" || true
          }
          ls -lh $ANDROID_HOME/ndk/ 2>&1 | head -20 || true
          NDK_PATH=""
          if [ -d "$ANDROID_HOME/ndk/26.1.10909125" ]; then NDK_PATH="$ANDROID_HOME/ndk/26.1.10909125"
          elif [ -d "$ANDROID_SDK_ROOT/ndk/26.1.10909125" ]; then NDK_PATH="$ANDROID_SDK_ROOT/ndk/26.1.10909125"; fi
          if [ -n "$NDK_PATH" ]; then
            echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
            echo "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
          else
            ANY_NDK=$(find $ANDROID_HOME $ANDROID_SDK_ROOT -path "*ndk/*/source.properties" 2>/dev/null | head -1 | xargs dirname 2>/dev/null | xargs dirname 2>/dev/null || true)
            if [ -n "$ANY_NDK" ]; then
              mkdir -p $(dirname "$ANDROID_HOME/ndk") 2>/dev/null || true
              ln -sf "$ANY_NDK" "$ANDROID_HOME/ndk/26.1.10909125" 2>/dev/null || true
              echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
            fi
          fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Diagnose Gradle Wrapper
        run: |
          echo "=== Diagnostics ==="
          java -version 2>&1 || echo "java not found"
          echo "JAVA_HOME=$JAVA_HOME"
          ls -lh gradle/wrapper/gradle-wrapper.jar || echo "wrapper jar missing"
          ls -lh gradlew
          cat gradle/wrapper/gradle-wrapper.properties
          echo "=== gradle.properties ==="
          cat gradle.properties || true
          # Try simple gradle tasks
          ./gradlew --version 2>&1 | head -100 || echo "gradlew --version failed"
          ./gradlew tasks --all 2>&1 | head -200 || echo "tasks failed"

      - name: Generate version
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          RUN_NUMBER=${{ github.run_number }}
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION_NAME=${{ github.ref_name }}
            VERSION_TAG=${{ github.ref_name }}
          else
            VERSION_NAME="v0.1.${RUN_NUMBER}-alpha"
            VERSION_TAG="v0.1.${RUN_NUMBER}-${SHORT_SHA}"
          fi
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "version_tag=${VERSION_TAG}" >> $GITHUB_OUTPUT
          echo "version_code=${RUN_NUMBER}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION_NAME} (code: ${RUN_NUMBER})"

      - name: Build Debug APK
        id: build_debug
        run: |
          set -o pipefail
          ./gradlew assembleDebug \
            -PversionName=${{ steps.version.outputs.version_name }} \
            -PversionCode=${{ steps.version.outputs.version_code }} \
            --stacktrace 2>&1 | tee build_debug.log
          echo "EXIT_CODE=$?"

      - name: Print build log tail
        if: always()
        run: |
          echo "========== BUILD LOG TAIL =========="
          tail -n 400 build_debug.log 2>&1 | head -c 10000 || echo "no log"
          echo "========== GREP ERRORS =========="
          grep -i "error\|failed\|exception\|FAILED" build_debug.log 2>&1 | head -100 || true
          echo "========== CMAKE LOGS =========="
          find app/build -name "*.log" 2>&1 | head -20
          cat app/build/intermediates/merged_manifests/debug/AndroidManifest.xml 2>&1 | head -20 || true

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ steps.version.outputs.version_name }}
          path: build_debug.log
          if-no-files-found: warn
          retention-days: 7

      - name: Create Issue with log on failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOG_TAIL=$(tail -n 300 build_debug.log 2>&1 | head -c 5000 || echo "no log")
          ERR_LINES=$(grep -i "error\|FAILED\|exception" build_debug.log 2>&1 | head -n 80 | head -c 4000 || echo "no errors")
          TITLE="CineCam build failed run ${{ github.run_number }} - ${{ steps.version.outputs.version_name }}"
          # Use python to properly escape
          python3 << PY
          import json, os
          body = """**Build failed:** ${{ steps.version.outputs.version_name }} (run ${{ github.run_number }})
          
          **Error lines:**
          \`\`\`
          $ERR_LINES
          \`\`\`
          
          **Log tail:**
          \`\`\`
          $LOG_TAIL
          \`\`\`
          
          [View run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"""
          # Actually read from env files
          PY
          LOG_TAIL_ESC=$(printf '%s' "$LOG_TAIL" | python3 -c "import json,sys; print(json.dumps(sys.stdin.read()))")
          ERR_ESC=$(printf '%s' "$ERR_LINES" | python3 -c "import json,sys; print(json.dumps(sys.stdin.read()))")
          BODY_JSON=$(python3 -c "import json; log=json.loads('$LOG_TAIL_ESC'); err=json.loads('$ERR_ESC'); body=f'**Build failed:** \$log\n\n**Error:**\n\`\`\`\n{err}\n\`\`\`\n\n**Tail:**\n\`\`\`\n{log}\n\`\`\`'; print(json.dumps(body))")
          TITLE_JSON=$(printf '%s' "$TITLE" | python3 -c "import json,sys; print(json.dumps(sys.stdin.read()))")
          curl -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/issues \
            -d "{\"title\": $TITLE_JSON, \"body\": $BODY_JSON, \"labels\": [\"ci-failure\"]}" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('html_url',''))" || true

      - name: Build Release APK (only if debug succeeded)
        if: success()
        run: |
          ./gradlew assembleRelease \
            -PversionName=${{ steps.version.outputs.version_name }} \
            -PversionCode=${{ steps.version.outputs.version_code }} \
            --stacktrace | tee build_release.log

      - name: List APKs
        if: always()
        run: |
          find app/build/outputs -name "*.apk" -type f | xargs ls -lh 2>&1 || echo "No APKs"
          ls -lh app/build/outputs/apk/debug/ 2>&1 | head -20 || true

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CineCam-${{ steps.version.outputs.version_name }}-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Prepare Release Notes
        if: github.event_name != 'pull_request' && success()
        run: |
          cat > /tmp/release_notes.md << 'EOF'
          ## CineCam ${{ steps.version.outputs.version_name }} - Professional RAW Camera

          **Build:** `${{ steps.version.outputs.short_sha }}` | **Run:** `#${{ github.run_number }}`

          ### ধাপ ১ - বেস আর্কিটেকচার
          - ✅ Kotlin + NDK/C++ হাইব্রিড আর্কিটেকচার
          - ✅ MemoryPool, RingBuffer, RawWriter, CineRawEngine, GlPreviewRenderer
          - ✅ Camera2 Capability Checker + Compose UI

          ### ডাউনলোড
          `app-debug.apk` ডাউনলোড করুন

          ### টেকনিক্যাল
          - minSdk 26 | targetSdk 34 | NDK 26.1 | C++17
          EOF
          cat /tmp/release_notes.md

      - name: Create GitHub Release
        if: github.event_name != 'pull_request' && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version_tag }}
          name: CineCam ${{ steps.version.outputs.version_name }}
          body_path: /tmp/release_notes.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version_name, 'alpha') }}
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: always()
        run: |
          echo "### CineCam Build" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.version_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
