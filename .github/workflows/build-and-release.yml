name: CineCam - Build and Release APK

on:
  push:
    branches: [main, "arena/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cinecam-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  native-tests:
    name: C++ core tests (ASan + UBSan)
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/test-native.sh

  build:
    name: Build Debug and unsigned Release
    needs: native-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - name: Version metadata
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="$REF_NAME"
          else
            VERSION="v0.1.${GITHUB_RUN_NUMBER}-alpha-${GITHUB_SHA:0:7}"
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build and test
        env:
          VERSION: ${{ steps.version.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease \
            "-PversionName=$VERSION" "-PversionCode=$GITHUB_RUN_NUMBER" \
            --stacktrace 2>&1 | tee build.log
      - name: Surface build errors in annotations
        if: failure()
        run: |
          set +e
          test -f build.log || exit 0
          grep -nE "^e: |error:|FAILED|Execution failed|Caused by" build.log | head -25 | while IFS= read -r line; do
            echo "::error title=Gradle::${line//$'\n'/ }"
          done
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            build.log
            app/build/reports/
          retention-days: 14
          if-no-files-found: warn
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: CineCam-APKs-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
    outputs:
      version: ${{ steps.version.outputs.name }}

  release:
    name: Publish tested alpha APK
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: CineCam-APKs-${{ github.run_number }}
          path: apk
      - name: Prepare APK and notes
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          mkdir -p release
          cp apk/debug/app-debug.apk release/CineCam-debug.apk
          (cd release && sha256sum CineCam-debug.apk > SHA256SUMS.txt)
          {
            echo "## CineCam $VERSION"
            echo
            echo 'পরীক্ষামূলক alpha build; ফোনে RAW recording/performance এখনো যাচাই হয়নি।'
            echo 'ইনস্টল করার জন্য CineCam-debug.apk ব্যবহার করুন; এটি debug key দিয়ে signed।'
            echo 'unsigned release APK শুধু Actions artifact-এ আছে; সরাসরি ইনস্টলযোগ্য নয়।'
            echo 'CI-এর debug key প্রতি runner-এ বদলাতে পারে; আপডেটে পুরোনো debug অ্যাপ আনইনস্টল লাগতে পারে।'
            echo
            echo "Commit: $GITHUB_SHA"
            echo "বিল্ড: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            cat CHANGELOG.md
          } > release/notes.md
      - name: Publish prerelease (never merge branches)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$VERSION" --target "$GITHUB_SHA" \
            --title "CineCam $VERSION" --prerelease --notes-file release/notes.md \
            release/CineCam-debug.apk release/SHA256SUMS.txt
